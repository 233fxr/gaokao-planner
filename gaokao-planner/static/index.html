<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高考复习规划助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; }
    .tab-active { color: #2563eb; border-bottom-color: #2563eb; }
    .loading-spinner { border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin-top: 1em; margin-bottom: 0.5em; font-weight: 600; }
    .markdown-content p { margin-bottom: 0.75em; line-height: 1.75; }
    .markdown-content code { background: #f3f4f6; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .markdown-content pre { background: #1f2937; color: #f3f4f6; padding: 1em; border-radius: 8px; overflow-x: auto; margin: 0.75em 0; }
    .markdown-content strong { font-weight: 600; }
    .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center text-white font-bold text-sm">高</div>
        <h1 class="text-lg font-semibold text-gray-900">高考复习规划助手</h1>
      </div>
      <span class="text-sm text-gray-400">AI · 选题 + 规划</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- Tabs -->
    <div class="flex border-b border-gray-200 mb-6">
      <button id="tab-questions" class="tab-btn px-6 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-colors" data-tab="questions">选题</button>
      <button id="tab-plan" class="tab-btn px-6 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition-colors" data-tab="plan">做计划</button>
    </div>

    <!-- Questions Panel -->
    <div id="panel-questions" class="tab-panel">
      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <label for="query-input" class="block text-sm font-medium text-gray-700 mb-2">题目描述</label>
        <textarea id="query-input" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-none" placeholder="例如：去年的广东卷物理最后一题&#10;或者：一道关于函数单调性的导数题"></textarea>
        <div class="flex items-center justify-between mt-3">
          <p class="text-xs text-gray-400">支持自然语言描述，AI 会生成对应题目和详细解析</p>
          <button id="btn-generate" class="bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            生成题目
          </button>
        </div>
      </div>

      <!-- Result area -->
      <div id="questions-result" class="mt-4 space-y-3">
        <!-- Loading -->
        <div id="questions-loading" class="hidden bg-white rounded-xl border border-gray-200 p-8 flex flex-col items-center justify-center gap-3">
          <div class="loading-spinner"></div>
          <p class="text-sm text-gray-500">正在生成题目（约需 30-60 秒）...</p>
        </div>
        <!-- Error -->
        <div id="questions-error" class="hidden bg-white rounded-xl border p-4 text-sm"></div>
        <!-- Empty -->
        <div id="questions-empty" class="bg-white rounded-xl border border-gray-200 p-8 text-center">
          <div class="text-gray-300 text-4xl mb-3">📝</div>
          <p class="text-sm text-gray-400">在上方输入题目描述，点击「生成题目」开始</p>
        </div>
        <!-- Content -->
        <div id="questions-content" class="hidden bg-white rounded-xl border border-gray-200 p-6">
          <div id="questions-meta" class="flex flex-wrap gap-2 mb-4"></div>
          <div id="questions-body" class="markdown-content text-gray-800 text-sm leading-relaxed"></div>
          <div id="questions-answer" class="mt-6 pt-4 border-t border-gray-100 hidden">
            <h3 class="text-sm font-semibold text-green-700 mb-2">✅ 参考答案与解析</h3>
            <div id="questions-answer-body" class="markdown-content text-gray-800 text-sm leading-relaxed"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Plan Panel -->
    <div id="panel-plan" class="tab-panel hidden">
      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <h2 class="text-base font-semibold text-gray-800 mb-4">学生信息</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="plan-name" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
            <input id="plan-name" type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="例如：小明" />
          </div>
          <div>
            <label for="plan-hours" class="block text-sm font-medium text-gray-700 mb-1">每周可用时间（小时）</label>
            <input id="plan-hours" type="number" min="1" max="168" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="例如：40" />
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="plan-start" class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
            <input id="plan-start" type="date" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" />
          </div>
          <div>
            <label for="plan-end" class="block text-sm font-medium text-gray-700 mb-1">结束日期</label>
            <input id="plan-end" type="date" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" />
          </div>
        </div>
        <div class="mb-4">
          <label for="plan-subjects" class="block text-sm font-medium text-gray-700 mb-1">需要复习的科目</label>
          <input id="plan-subjects" type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="用逗号分隔，例如：数学、物理、化学" />
        </div>
        <div class="mb-4">
          <label for="plan-weak" class="block text-sm font-medium text-gray-700 mb-1">薄弱知识点</label>
          <textarea id="plan-weak" rows="2" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-none" placeholder="用逗号分隔，例如：函数单调性、电磁感应、有机化学"></textarea>
        </div>
        <div class="flex justify-end">
          <button id="btn-plan" class="bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            生成复习计划
          </button>
        </div>
      </div>

      <!-- Result area -->
      <div id="plan-result" class="mt-4 space-y-3">
        <div id="plan-loading" class="hidden bg-white rounded-xl border border-gray-200 p-8 flex flex-col items-center justify-center gap-3">
          <div class="loading-spinner"></div>
          <p class="text-sm text-gray-500">正在生成复习计划（约需 60-120 秒）...</p>
        </div>
        <div id="plan-error" class="hidden bg-white rounded-xl border p-4 text-sm"></div>
        <div id="plan-empty" class="bg-white rounded-xl border border-gray-200 p-8 text-center">
          <div class="text-gray-300 text-4xl mb-3">📋</div>
          <p class="text-sm text-gray-400">填写学生信息后，点击「生成复习计划」</p>
        </div>
        <div id="plan-content" class="hidden bg-white rounded-xl border border-gray-200 p-6">
          <div id="plan-body" class="markdown-content text-gray-800 text-sm leading-relaxed"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="/app.js"></script>
</body>
</html>
